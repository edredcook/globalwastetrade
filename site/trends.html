}

*{box-sizing:border-box}

.brand{font-family:var(--display);font-weight:800;font-stretch:80%;font-size:22px;letter-spacing:.01em;text-transform:uppercase;display:flex;align-items:center;gap:10px}

.brand{color:inherit;text-decoration:none}

.ctl{display:flex;flex-direction:column;gap:5px;min-width:0;max-width:100%}
.ctl > span{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:20px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px 14px;min-width:0;display:flex;flex-direction:column;gap:8px}
.card.wide{grid-column:1/-1}

.card .hd .seg button,.card .hd select{font-size:13px;padding:4px 10px}

.chart{position:relative;min-width:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.scroll{overflow-x:auto}
.ax text{fill:var(--muted);font-family:var(--mono);font-size:11px}
.ax line,.ax path{stroke:var(--grid)}
.gl line{stroke:var(--grid)}
.note text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.note line{stroke:var(--muted);stroke-dasharray:3 3}
.lbl{font-size:11.5px;font-family:var(--body);font-weight:600}

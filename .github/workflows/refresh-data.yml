name: Refresh Comtrade data
on:
  workflow_dispatch:
    inputs:
      years:
        description: Years to download, separated by spaces (blank means the last three years)
        default: ""
        required: false
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st of each month
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      YEARS: ${{ github.event.inputs.years }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download from UN Comtrade and build each year
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          KCS_SERVICE_KEY: ${{ secrets.KCS_SERVICE_KEY }}
          MIXED: 550510,6309,6310,854931,854939,854991,854999,382510,4707,401220,4004,401700
          MATERIALS: paper metals textiles ewaste
          POLY: 391510,391520,391530,391590
        run: |
          # Codes of each other material group, from build_site_data.MATERIALS
          codes() { python -c "import sys; sys.path.insert(0, 'pipeline'); import build_site_data as b; print(','.join(b.material_codes('$1')))"; }
          if [ -z "$YEARS" ]; then Y=$(date -u +%Y); YEARS="$((Y-3)) $((Y-2)) $((Y-1))"; fi
          echo "YEARS=$YEARS" >> "$GITHUB_ENV"
          : > failed.txt
          for y in $YEARS; do
            if ! python pipeline/fetch_comtrade.py --year "$y"; then
              echo "$y: no download" >> failed.txt; continue
            fi
            if ! python pipeline/fetch_comtrade.py --year "$y" --name mixed --cmd "$MIXED"; then
              echo "$y: no download of the mixed streams" >> failed.txt; continue
            fi
            python pipeline/build_site_data.py --year "$y" || echo "$y: build stopped, see the report" >> failed.txt
            # HS 3915 by polymer (shares only)
            if python pipeline/fetch_comtrade.py --year "$y" --name poly --cmd "$POLY"; then
              python pipeline/build_site_data.py --year "$y" --polymers || echo "$y polymers: build stopped" >> failed.txt
            else
              echo "$y: no download of HS 3915 by polymer" >> failed.txt
            fi
            for m in $MATERIALS; do
              if python pipeline/fetch_comtrade.py --year "$y" --name "$m" --cmd "$(codes $m)"; then
                python pipeline/build_site_data.py --year "$y" --material "$m" || echo "$y $m: build stopped, see the report" >> failed.txt
              else
                echo "$y: no download of $m" >> failed.txt
              fi
            done
          done
          # Last year and the current year: annual returns where filed, the rest modelled
          # from the months published so far (each needs the year before's months too).
          Y=$(date -u +%Y)
          for y in $((Y-2)) $((Y-1)) $Y; do
            python pipeline/fetch_comtrade.py --year "$y" --monthly || echo "$y: no monthly download" >> failed.txt
            python pipeline/fetch_comtrade.py --year "$y" --monthly --name mixed --cmd "$MIXED" \
              || echo "$y: no monthly download of the mixed streams" >> failed.txt
            for m in $MATERIALS; do
              python pipeline/fetch_comtrade.py --year "$y" --monthly --name "$m" --cmd "$(codes $m)" \
                || echo "$y: no monthly download of $m" >> failed.txt
            done
          done
          # Months not yet in Comtrade, from national statistics offices (provisional)
          NOW=$(date -u +%Y%m); MONTHS=""
          for y in $((Y-1)) $Y; do for m in 01 02 03 04 05 06 07 08 09 10 11 12; do
            [ "$y$m" -lt "$NOW" ] && MONTHS="$MONTHS --month $y-$m"
          done; done
          python pipeline/fetch_national.py --source all $MONTHS || echo "national data: some months not fetched" >> failed.txt
          for y in $((Y-1)) $Y; do
            # Polymer shares for reporters with no annual return yet, from their months so far
            if python pipeline/fetch_comtrade.py --year "$y" --monthly --name poly --cmd "$POLY"; then
              [ -f "pipeline/raw/comtrade_poly_${y}.json" ] || python pipeline/fetch_comtrade.py --year "$y" --name poly --cmd "$POLY" || true
              python pipeline/build_site_data.py --year "$y" --polymers || echo "$y polymers (months): build stopped" >> failed.txt
            else
              echo "$y: no monthly download of HS 3915 by polymer" >> failed.txt
            fi
            if python pipeline/model_part_year.py --year "$y" && python pipeline/model_part_year.py --year "$y" --name mixed; then
              python pipeline/build_site_data.py --year "$y" || echo "$y (modelled): build stopped, see the report" >> failed.txt
            else
              echo "$y (modelled): not modelled" >> failed.txt
            fi
            for m in $MATERIALS; do
              if python pipeline/model_part_year.py --year "$y" --name "$m"; then
                python pipeline/build_site_data.py --year "$y" --material "$m" || echo "$y $m (modelled): build stopped, see the report" >> failed.txt
              else
                echo "$y $m (modelled): not modelled" >> failed.txt
              fi
            done
          done
          python pipeline/build_trends.py
          python pipeline/build_validation.py
          python pipeline/build_stories.py
      - name: Keep the check report even if the build stopped
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comtrade-${{ github.run_id }}
          path: |
            pipeline/reports/
            pipeline/raw/
          retention-days: 30
      - name: Tests
        run: python -m unittest discover -s pipeline/tests -v
      - name: Open a pull request with the new data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- site/data pipeline/reports; then
            echo "No change in the data."; exit 0
          fi
          BR="data/refresh-$(date -u +%Y%m%d)"
          { echo "Years refreshed: ${YEARS}"; if [ -s failed.txt ]; then echo; echo "Not updated:"; sed 's/^/- /' failed.txt; fi
            for y in $YEARS; do f="pipeline/reports/hs3915_${y}.md"; [ -f "$f" ] && { echo; cat "$f"; }; done
            for y in $YEARS; do for m in $MATERIALS; do f="pipeline/reports/${m}_${y}.md"; [ -f "$f" ] && { echo; sed -n '1,12p' "$f"; }; done; done; } > pr-body.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add site/data pipeline/reports
          git commit -m "Refresh waste trade data from UN Comtrade (${YEARS})"
          git push -u origin "$BR"
          gh pr create --draft --base main --head "$BR" \
            --title "Data refresh: plastics and other materials, ${YEARS}" \
            --body-file pr-body.md \
            || echo "::warning::Branch $BR pushed, but the PR could not be opened. Allow Actions to create pull requests in Settings > Actions > General, or open it by hand."
